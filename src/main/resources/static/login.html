<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 · keep it</title><link rel="icon" href="/brand-mark.svg"><link rel="stylesheet" href="/style.css"><script src="/auth.js" defer></script></head>
<body class="auth-page"><main class="auth-card"><a class="auth-brand" href="/login.html"><img src="/brand-mark.svg" alt="" width="34" height="34"><strong>keep it<span> ·</span></strong></a><h1 id="auth-title">다시 만나서 반가워요</h1><p id="auth-subtitle">로그인하고 나의 경험을 이어서 기록해요.</p><form id="auth-form"><label class="field">이메일<input name="email" type="email" maxlength="160" autocomplete="email" required placeholder="이메일을 입력해주세요"></label><label class="field">비밀번호<input name="password" type="password" minlength="10" maxlength="72" autocomplete="current-password" required placeholder="10자 이상 입력해주세요"></label><p id="auth-error" class="form-error" role="alert"></p><button class="button primary auth-submit" id="auth-submit" type="submit">로그인</button></form><p class="auth-switch"><span id="auth-switch-label">아직 계정이 없나요?</span> <button type="button" id="auth-switch">회원가입</button></p></main></body></html>
