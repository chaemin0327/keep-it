server.address=0.0.0.0
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${KEEPIT_DATABASE_URL}
spring.datasource.username=${KEEPIT_DATABASE_USER}
spring.datasource.password=${KEEPIT_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=keepit
spring.mail.host=${KEEPIT_SMTP_HOST}
spring.mail.port=${KEEPIT_SMTP_PORT:587}
spring.mail.username=${KEEPIT_SMTP_USER}
spring.mail.password=${KEEPIT_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

keepit.auth.require-verification=true
keepit.auth.public-url=${KEEPIT_PUBLIC_URL}
keepit.auth.mail-from=${KEEPIT_MAIL_FROM}
