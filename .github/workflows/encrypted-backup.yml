name: Encrypted database backup
on:
  schedule:
    - cron: '19 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_CERT_PEM: ${{ secrets.BACKUP_CERT_PEM }}
      BACKUP_DB_CA_PEM: ${{ secrets.BACKUP_DB_CA_PEM }}
      PGSSLMODE: verify-full
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        run: |
          test -n "$BACKUP_DATABASE_URL" && test -n "$BACKUP_CERT_PEM" || { echo 'Backup secrets are not configured'; exit 1; }
          python3 -c 'import os,sys,urllib.parse as u; p=u.urlparse(os.environ["BACKUP_DATABASE_URL"]); q=u.parse_qs(p.query); sys.exit(0 if p.scheme in ("postgres", "postgresql") and q.get("sslmode", ["verify-full"]) == ["verify-full"] else 1)'
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt/ noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Create encrypted backup
        env:
          BACKUP_CERT_FILE: /tmp/keepit-backup-cert.pem
        run: |
          umask 077
          printf '%s\n' "$BACKUP_CERT_PEM" > "$BACKUP_CERT_FILE"
          if [ -n "$BACKUP_DB_CA_PEM" ]; then
            printf '%s\n' "$BACKUP_DB_CA_PEM" > /tmp/keepit-db-ca.pem
            export PGSSLROOTCERT=/tmp/keepit-db-ca.pem
          fi
          scripts/encrypted-backup.sh keepit-backup.dump.p7m
          rm -f "$BACKUP_CERT_FILE" /tmp/keepit-db-ca.pem
      - name: Store encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: keepit-encrypted-backup-${{ github.run_id }}
          path: keepit-backup.dump.p7m
          retention-days: 30
          if-no-files-found: error
